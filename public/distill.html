<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTMW3D → 37点 WebGPU蒸留</title><link rel="stylesheet" href="style.css"><style>main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:clamp(28px,5vw,52px)}section{background:#152127;border:1px solid #30434a;border-radius:16px;padding:24px;margin:20px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}label{display:block}input,select{width:100%;margin-top:7px}progress{width:100%;height:26px}canvas{max-width:100%;background:#050a0d;border-radius:10px}#log{max-height:220px;overflow:auto;white-space:pre-wrap}button:disabled{opacity:.4}a{color:#a6e77c}.result{font-variant-numeric:tabular-nums;font-size:22px}small{color:#a5b7be}</style></head><body><main>
<link rel="stylesheet" href="distill/colors.css?revision=2"><style>html,body{background:#0c1317;color:#eaf1f2}h1,h2,p,pre{color:#eaf1f2}label,small{color:#bacbd2}input,select{background:#0c1317;color:#f2f7f8}button{background:#a9ef86;color:#102016}</style>
<a href="./">WholeBody73 学習へ戻る</a><h1>RTMW3Dから、軽い37点モデルへ。</h1><p>身体・かかと・親指側・小指側・手指を、画像から奥行きまで学習します。</p>
<section><h2>1. 教師を準備</h2><label>公式RTMW3DのFP32 ONNX（既存の133点版も使用可）<input id="teacher-file" type="file" accept=".onnx"></label><div class="actions"><button id="prepare">WebGPUを準備</button></div><p id="teacher-status">教師ONNXを選んでください。</p><small>既存のRTMW3D ONNXはブラウザで蒸留用に読み替えます。公式.pthから初めて変換する場合は tools/distill/export_teacher.py を使用します。</small></section>
<section><h2>2. 教師データを保存</h2><div class="fields"><label>COCO＋CMUから取得する例数<input id="limit" type="number" min="1" value="54614"></label><label>用途<select id="split"><option value="train">学習</option><option value="val">評価</option></select></label></div><div class="actions"><button id="label-data" disabled>既存画像から教師を作る</button></div>
<label>足上げ・足裏などの撮影動画<input id="video-file" type="file" accept="video/*"></label><div class="fields"><label>人物枠 x,y,幅,高さ（0〜1）<input id="roi" value="0,0,1,1"></label><label>抽出するフレーム数 / 秒<input id="fps" type="number" min="0.2" max="30" step="0.2" value="4"></label></div><div class="actions"><button id="label-video" disabled>動画から教師を作る</button><button id="teacher-view" disabled>現在のフレームに教師を重ねる</button></div><video id="video" controls muted playsinline style="max-width:100%;max-height:300px"></video><p id="cache-status">保存済み教師 0例</p></section>
<section><h2>3. 軽量モデルを学習</h2><div class="fields"><label>目標エポック<input id="epochs" type="number" min="1" value="100"></label><label>画像バッチ<input id="batch" type="number" min="1" max="64" value="4"></label><label>学習率<input id="lr" type="number" min="0.000001" step="0.0001" value="0.0003"></label><label>乱数Seed<input id="seed" type="number" value="20261104"></label></div><div class="actions"><button id="train" disabled>蒸留を開始・続行</button><button id="stop" disabled>停止して保存</button><button id="restore" disabled>ブラウザ内の学習を復元</button><button id="backup" disabled>復元JSONを保存</button></div><label>復元JSONを読み込む<input id="checkpoint" type="file" accept=".json,.gz"></label><progress id="progress" max="1" value="0"></progress><p id="status">準備待ち</p><p id="stats" class="result">—</p><small>60秒ごとに学習状態を保存し、学習30分ごとに復元JSONをダウンロードします。</small></section>
<section><h2>4. 動きと速度を確認・保存</h2><label>人物画像<input id="image-file" type="file" accept="image/*"></label><div class="actions"><button id="infer" disabled>画像または現在の動画フレームで推論</button><button id="evaluate" disabled>保存した評価用データで確認</button><button id="export" disabled>軽量ONNXを保存</button><button id="report" disabled>学習結果JSONを保存</button></div><p id="latency"></p><canvas id="overlay" width="576" height="768"></canvas><p id="metrics"></p></section><pre id="log"></pre>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.22.0/dist/tf-backend-webgpu.min.js"></script><script type="module" src="distill/app.mjs"></script></main></body></html>
